version: 2

# Grouping policy
# ---------------
# Every ecosystem groups its minor and patch bumps into a single PR, and leaves
# majors as individual PRs.
#
# Why group at all: `main` requires branches to be up to date before merging
# (branch protection `strict: true`), so every merge re-bases-out every other
# open PR and a batch lands strictly one PR per CI cycle. One PR per package
# turns a routine week into a serialised queue — 2026-09-04 had sixteen open at
# once, six of which were individual backend pip bumps that could have been one.
#
# Why minor/patch only: bundling a major in with patches means the whole group
# is blocked behind whatever review the major needs. The `anthropic` 0.x -> 1.x
# bump (#1359) is the worked example — it wanted a real read of the migration
# guide, and grouping it with four harmless patches would have held those
# hostage to it.
#
# The one exception: packages that are version-locked to each other move as a
# unit, majors included. `@vitest/coverage-v8` declares an exact peer on the
# matching `vitest`, so splitting them can never pass — the vitest 5 bump
# arrived as four PRs (#1411-#1414), each failing `npm ci` with ERESOLVE against
# the other half's pin (STUDIO-457).
#
# Name every package in such a group EXACTLY, never by wildcard. Dependabot
# puts a package in its most specific matching group, not the first one listed,
# and a wildcard pattern ranks below `dev-deps`'s `dependency-type` rule. With
# `@vitest/*`, the job log read "Skipping @vitest/coverage-v8 for group
# 'vitest' - belongs to more specific group 'dev-deps'", and because dev-deps
# takes only minor/patch bumps, the major split off on its own again. An exact
# name outranks dev-deps, as `vitest` itself did. Check the grouping decisions
# with `gh run view <id> --log | grep "for group"` on the Dependabot run.
#
# Note: security updates bypass grouping entirely — Dependabot always raises an
# advisory fix as its own PR. That is the desired behaviour and this config does
# not change it.

updates:
  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns: ["vitest", "@vitest/coverage-v8"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint peer-caps TypeScript at <6.1.0; TS 7 breaks npm ci.
      # Hold TS majors until typescript-eslint widens its peer range (STUDIO-275).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm (Electron shell)
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns: ["vitest", "@vitest/coverage-v8"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # pip (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker base images (frontend build + serve stages)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker base image (backend)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-image:
        patterns: ["*"]
        update-types: ["minor", "patch"]
